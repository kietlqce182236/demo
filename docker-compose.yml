version: '3.8'

services:
  # ============================================================================
  # Nginx — HTTPS Reverse Proxy & SSL Termination
  # ============================================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: kidmeal_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - kidsnutri_network

  # ============================================================================
  # Backend — NestJS 10 API & WebSocket Server
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: kidmeal_backend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3000
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173,https://localhost}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-KidMeal}
      - POSTGRES_USER=${POSTGRES_USER:-KidMeal}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-A5a(sSghC=~oqs£43Up}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-RedisSecureToken2026!}
      - JWT_SECRET=${JWT_SECRET:-super-secret-jwt-signing-key-minimum-32-chars-kidsnutri-2026}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-15m}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-super-secret-refresh-jwt-key-minimum-32-chars-nutri-2026}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-7d}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio}
      - MINIO_PORT=${MINIO_PORT:-9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin123}
      - MINIO_BUCKET=${MINIO_BUCKET:-kidmeal-uploads}
      - VNPAY_TMN_CODE=${VNPAY_TMN_CODE:-SANDBOX01TMN}
      - VNPAY_HASH_SECRET=${VNPAY_HASH_SECRET:-SECRETSECRETSECRETSECRETSECRET123}
      - VNPAY_URL=${VNPAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      - VNPAY_RETURN_URL=${VNPAY_RETURN_URL:-https://localhost/payments/vnpay-return}
      - MAIL_HOST=${MAIL_HOST:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_SECURE=${MAIL_SECURE:-false}
      - MAIL_USER=${MAIL_USER:-lamquockiet240321@gmail.com}
      - MAIL_PASS=${MAIL_PASS:-luvzjmhyvuohzjb}
      - MAIL_FROM=${MAIL_FROM:-lamquockiet240321@gmail.com}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kidsnutri_network

  # ============================================================================
  # Frontend — React 18 + Vite SPA
  # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: kidmeal_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    environment:
      - VITE_API_BASE_URL=https://localhost/api/v1
      - VITE_SOCKET_URL=https://localhost
    volumes:
      - ./apps/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - kidsnutri_network

  # ============================================================================
  # MinIO — S3 Compatible Object Storage (Food inspections, Avatars)
  # ============================================================================
  minio:
    image: elestio/minio:latest
    container_name: kidmeal_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    volumes:
      - miniodata:/data
    networks:
      - kidsnutri_network

  # ============================================================================
  # PostgreSQL 16 — Relational Database
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: kidmeal_postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-KidMeal}
      POSTGRES_USER: ${POSTGRES_USER:-KidMeal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-A5a(sSghC=~oqs£43Up}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-KidMeal} -d ${POSTGRES_DB:-KidMeal}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - kidsnutri_network

  # ============================================================================
  # Redis 7 - Cache, Session Store & Real-time PubSub
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: kidmeal_redis
    restart: unless-stopped
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-RedisSecureToken2026!}
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-RedisSecureToken2026!}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD:-RedisSecureToken2026!}\" ping | grep PONG || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - kidsnutri_network

volumes:
  pgdata:
    name: kidmeal_pgdata
  redisdata:
    name: kidmeal_redisdata
  miniodata:
    name: kidmeal_miniodata

networks:
  kidsnutri_network:
    name: kidsnutri_network
    driver: bridge
